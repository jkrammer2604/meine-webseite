<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoucherPay Ultimate</title>
    <link rel="icon" href="data:,">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151b2c;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid #242f47;
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            justify-content: center;
        }

        .brand i {
            font-size: 28px;
            color: var(--primary);
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand span {
            color: var(--primary);
        }

        .intro-text {
            text-align: center;
            margin-bottom: 28px;
        }

        .intro-text h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .intro-text p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background-color: #1e2640;
            border: 1px solid #2e3a5f;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #242e4d;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .status-box {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="auth-card">
    <div class="brand">
        <i class="fa-solid fa-wallet"></i>
        <h1>VoucherPay<span>Ultimate</span></h1>
    </div>

    <div class="intro-text">
        <h2>Willkommen zurück</h2>
        <p>Melde dich mit deinem Nutzernamen an.</p>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">Nutzername</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="Nutzername eingeben" required>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Passwort</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
            <span>Anmelden</span>
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </form>

    <div id="statusBox" class="status-box">
        <i id="statusIcon"></i>
        <span id="statusText"></span>
    </div>
</div>

<script>
    // ====== 1. SUPABASE CONFIGURATION ======
    const SUPABASE_URL = "https://cilvtkbochcuanmakrgq.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_coOF7Q0OugnqGltdZ5P3Vw_IEa5PRwd"; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginForm = document.getElementById('loginForm');
    const statusBox = document.getElementById('statusBox');
    const statusIcon = document.getElementById('statusIcon');
    const statusText = document.getElementById('statusText');
    const submitBtn = document.getElementById('submitBtn');

    function showStatus(type, message) {
        statusBox.style.display = "flex";
        statusText.innerText = message;
        
        if (type === 'loading') {
            statusBox.style.backgroundColor = "rgba(99, 102, 241, 0.1)";
            statusBox.style.color = "var(--primary)";
            statusIcon.className = "fa-solid fa-circle-notch fa-spin";
        } else if (type === 'success') {
            statusBox.style.backgroundColor = "rgba(16, 185, 129, 0.1)";
            statusBox.style.color = "var(--accent)";
            statusIcon.className = "fa-solid fa-circle-check";
        } else if (type === 'error') {
            statusBox.style.backgroundColor = "rgba(239, 68, 68, 0.1)";
            statusBox.style.color = "var(--danger)";
            statusIcon.className = "fa-solid fa-circle-exclamation";
        }
    }

    // ====== 2. LOGIK FÜR DEINE ACCOUNTS-TABELLE ======
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const inputUsername = document.getElementById('username').value.trim();
        const inputPassword = document.getElementById('password').value;
        
        submitBtn.disabled = true;
        showStatus('loading', 'Überprüfe Kontodaten...');

        try {
            // Nutzt standardmäßig den Tabellennamen 'accounts'
            const { data, error } = await supabaseClient
                .from('accounts') 
                .select('*')
                .eq('name', inputUsername)
                .eq('pass', inputPassword);

            if (error) {
                showStatus('error', 'Datenbankfehler: ' + error.message);
                console.error("Fehler bei Tabellen-Abfrage:", error);
                submitBtn.disabled = false;
                return;
            }

            // Wenn kein passender Eintrag gefunden wurde
            if (data.length === 0) {
                showStatus('error', 'Nutzername oder Passwort ist falsch.');
                submitBtn.disabled = false;
            } else {
                // Nutzer erfolgreich in deiner Tabelle gefunden!
                showStatus('success', 'Erfolgreich angemeldet!');
                console.log("Eingeloggt! Benutzer-Reihe:", data[0]);
                
                // Hier kannst du die Weiterleitung aktivieren:
                // window.location.href = "dashboard.html";
            }

        } catch (err) {
            showStatus('error', 'Verbindung zur Tabelle fehlgeschlagen.');
            console.error("Kritischer Fehler:", err);
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
