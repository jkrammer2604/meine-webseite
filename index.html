<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Inventur Pro - Info Modus</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --info: #0ea5e9;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            margin-bottom: 15px;
            text-align: center;
            color: #475569;
        }

        /* Modus-Auswahl Schalter */
        .mode-selector {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 20px;
            gap: 4px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            background: transparent;
            color: #64748b;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active[data-mode="buchen"] {
            background: var(--success);
            color: white;
        }

        .mode-btn.active[data-mode="abrufen"] {
            background: var(--info);
            color: white;
        }

        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px dashed var(--primary) !important;
            background: #fafafa;
        }

        /* Overlay für Ergebnisse */
        .scan-overlay {
            display: none;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 2px solid transparent;
        }

        .scan-overlay.active { display: block; }
        .scan-overlay.buchen-style { background-color: #f0fdf4; border-color: var(--success); }
        .scan-overlay.abrufen-style { background-color: #f0f9ff; border-color: var(--info); }

        .scan-overlay p { margin: 0 0 15px 0; font-size: 1.1rem; }

        button {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 14px 10px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        th { background-color: #f1f5f9; color: #475569; font-weight: 600; }

        tr.highlight {
            background-color: #f0fdf4;
            animation: flash 1.2s ease-out;
        }

        @keyframes flash {
            0% { background-color: #bbf7d0; }
            100% { background-color: #f0fdf4; }
        }

        .editable-name {
            border: 1px solid transparent;
            background: transparent;
            font-weight: bold;
            text-align: center;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text);
            width: 90;
            padding: 4px;
        }

        .editable-name:focus {
            border-color: var(--primary);
            background: white;
            border-radius: 4px;
            outline: none;
        }

        .actions { display: flex; gap: 6px; justify-content: center; }
        .btn-small { padding: 6px 12px; font-size: 0.9rem; border-radius: 6px; }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📦 Smart Inventur Pro</h1>

        <div class="card">
            <h2>Kamera-Scanner</h2>
            
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="buchen" onclick="setModus('buchen')">📥 Buchen (+1)</button>
                <button class="mode-btn" data-mode="abrufen" onclick="setModus('abrufen')">🔍 Nur Abrufen (Info)</button>
            </div>
            
            <div id="scanOverlay" class="scan-overlay">
                <p id="scanInfoText">Artikel erfasst!</p>
                <button onclick="scannerFortsetzen()">Nächster Scan</button>
            </div>

            <div id="reader"></div>
        </div>

        <div class="card" style="overflow-x: auto;">
            <h2>📋 Aktueller Lagerbestand</h2>
            <table>
                <thead>
                    <tr>
                        <th>Barcode</th>
                        <th>Artikelname</th>
                        <th>Menge</th>
                        <th>Aktionen</th>
                    </tr>
                </thead>
                <tbody id="inventurListe">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        let inventar = JSON.parse(localStorage.getItem('inventarData')) || [];
        let html5QrcodeScanner;
        let audioCtx = null;
        let aktuellerModus = "buchen"; // Standardmodus

        window.onload = function() {
            tabelleRendern();
            scannerStarten();
        };

        // Wechselt zwischen den Modi
        function setModus(modus) {
            aktuellerModus = modus;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.mode-btn[data-mode="${modus}"]`).classList.add('active');
        }

        function playBeep(art) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            // Unterschiedliche Töne je nach Modus
            osc.frequency.value = art === "abrufen" ? 1000 : 800; 
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function nameAktualisieren(id, neuerName) {
            const artikel = inventar.find(item => item.id === id);
            if (artikel && neuerName.trim() !== "") {
                artikel.name = neuerName.trim();
                localStorage.setItem('inventarData', JSON.stringify(inventar));
            }
        }

        function artikelLoeschen(id) {
            if(confirm("Möchtest du diesen Artikel wirklich löschen?")) {
                inventar = inventar.filter(item => item.id !== id);
                speichernUndAktualisieren();
            }
        }

        function mengeAendern(id, wert) {
            const artikel = inventar.find(item => item.id === id);
            if (artikel) {
                artikel.menge += wert;
                if (artikel.menge < 0) artikel.menge = 0;
                speichernUndAktualisieren();
            }
        }

        function speichernUndAktualisieren() {
            localStorage.setItem('inventarData', JSON.stringify(inventar));
            tabelleRendern();
        }

        function tabelleRendern() {
            const liste = document.getElementById('inventurListe');
            liste.innerHTML = '';

            if (inventar.length === 0) {
                liste.innerHTML = `<tr><td colspan="4" style="color:#94a3b8;">Keine Artikel im Lager.</td></tr>`;
                return;
            }

            inventar.forEach(item => {
                const tr = document.createElement('tr');
                tr.setAttribute('data-code', item.code);
                tr.innerHTML = `
                    <td style="font-family: monospace; font-size: 0.9rem; color: #64748b;">${item.code}</td>
                    <td>
                        <input type="text" class="editable-name" value="${item.name}" onchange="nameAktualisieren('${item.id}', this.value)">
                    </td>
                    <td><span style="font-size: 1.1rem; font-weight: bold; color: var(--primary);">${item.menge}</span></td>
                    <td class="actions">
                        <button class="btn-small" onclick="mengeAendern('${item.id}', 1)">+</button>
                        <button class="btn-small" onclick="mengeAendern('${item.id}', -1)">-</button>
                        <button class="btn-small btn-danger" onclick="artikelLoeschen('${item.id}')">🗑️</button>
                    </td>
                `;
                liste.appendChild(tr);
            });
        }

        function artikelHighlighten(code) {
            const zeilen = document.querySelectorAll(`tr[data-code="${code}"]`);
            zeilen.forEach(zeile => {
                zeile.classList.add('highlight');
                zeile.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => zeile.classList.remove('highlight'), 1200);
            });
        }

        // SCANNER LOGIK
        function scannerStarten() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: { width: 250, height: 150 }, rememberLastUsedCamera: true }, false
            );

            function onScanSuccess(decodedText, decodedResult) {
                html5QrcodeScanner.pause(true);
                playBeep(aktuellerModus);

                const treffer = inventar.find(item => item.code === decodedText);
                const overlay = document.getElementById('scanOverlay');
                const infoText = document.getElementById('scanInfoText');
                
                // Klassen für das Overlay zurücksetzen
                overlay.className = "scan-overlay active";

                if (aktuellerModus === "buchen") {
                    // --- MODUS: BUCHEN ---
                    overlay.classList.add('buchen-style');
                    let anzeigeName = "";

                    if (treffer) {
                        treffer.menge += 1;
                        anzeigeName = treffer.name;
                    } else {
                        anzeigeName = "Neu: " + decodedText;
                        inventar.push({
                            id: Date.now().toString(),
                            code: decodedText,
                            name: anzeigeName,
                            menge: 1
                        });
                    }
                    speichernUndAktualisieren();
                    infoText.innerHTML = `📥 <strong>${anzeigeName}</strong> verbucht!<br>Neue Menge: <strong>${treffer ? treffer.menge : 1}</strong>`;
                    
                } else {
                    // --- MODUS: NUR ABRUFEN ---
                    overlay.classList.add('abrufen-style');
                    
                    if (treffer) {
                        infoText.innerHTML = `🔍 <strong>Artikel gefunden:</strong><br>Name: ${treffer.name}<br>Aktueller Bestand: <strong>${treffer.menge}</strong>`;
                    } else {
                        infoText.innerHTML = `❌ <strong>Code unbekannt</strong><br>Der Code <i>${decodedText}</i> ist nicht im System hinterlegt.`;
                    }
                }

                artikelHighlighten(decodedText);
            }

            html5QrcodeScanner.render(onScanSuccess, function(error){});
        }

        function scannerFortsetzen() {
            document.getElementById('scanOverlay').classList.remove('active');
            html5QrcodeScanner.resume();
        }
    </script>
</body>
</html>
